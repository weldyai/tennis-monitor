name: Tennis Monitor

on:
  schedule:
    - cron: "11,41 * * * *"   # toutes les 30 min, hors :00/:30 (pics de charge GitHub)
  workflow_dispatch:        # déclenchement manuel depuis GitHub

permissions:
  contents: write

concurrency:
  group: telegram-state
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests playwright beautifulsoup4
          playwright install chromium
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u scraper.py

      - name: Upload debug HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-page
          path: debug_page.html
          retention-days: 1

      - name: Commit updated state
        if: ${{ !cancelled() }}
        run: |
          git config user.name "tennis-monitor"
          git config user.email "bot@tennis-monitor"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update state $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            echo "push conflict, retry $i..."
            sleep $((RANDOM % 10 + 1))
          done
