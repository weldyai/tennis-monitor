name: Tennis Monitor

on:
  schedule:
    - cron: "0,30 * * * *"   # toutes les 30 minutes
  workflow_dispatch:        # déclenchement manuel depuis GitHub

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests playwright beautifulsoup4
          playwright install chromium --with-deps

      - name: Check Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo" | python3 -c "import json,sys; d=json.load(sys.stdin); print('Webhook URL:', d['result'].get('url', '(none)') or '(none - polling OK)')"
          echo "--- Raw getUpdates ---"
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=0&timeout=0" | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d, indent=2))"

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Upload debug HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-page
          path: debug_page.html
          retention-days: 1

      - name: Commit updated state
        run: |
          git config user.name "tennis-monitor"
          git config user.email "bot@tennis-monitor"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update state $(date -u +%Y-%m-%dT%H:%M)"
          git push
