name: Tennis Monitor

on:
  schedule:
    - cron: "0,30 * * * *"   # toutes les 30 minutes
  workflow_dispatch:        # déclenchement manuel depuis GitHub

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests playwright beautifulsoup4
          playwright install chromium --with-deps

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Upload debug HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-page
          path: debug_page.html
          retention-days: 1

      - name: Commit updated state
        run: |
          git config user.name "tennis-monitor"
          git config user.email "bot@tennis-monitor"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update state $(date -u +%Y-%m-%dT%H:%M)"
          git push
