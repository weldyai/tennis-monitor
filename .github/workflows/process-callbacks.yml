name: Process Telegram Callbacks

on:
  schedule:
    - cron: "*/5 * * * *"   # toutes les 5 minutes (GitHub ne fiabilise pas en dessous)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-state
  cancel-in-progress: false

jobs:
  callbacks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: DIAG telegram (temporaire, lecture seule)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          B=https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN
          echo "== getMe"; curl -s $B/getMe
          echo; echo "== getWebhookInfo"; curl -s $B/getWebhookInfo
          echo; echo "== getUpdates (sans offset, ne confirme rien)"; curl -s "$B/getUpdates?timeout=0&allowed_updates=%5B%22message%22,%22callback_query%22%5D"
          echo; echo "chat_id=$TELEGRAM_CHAT_ID"

      - name: Process callbacks
        if: false
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u scraper.py --callbacks-only

      - name: Commit updated state
        if: false
        run: |
          git config user.name "tennis-monitor"
          git config user.email "bot@tennis-monitor"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: callbacks $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            echo "push conflict, retry $i..."
            sleep $((RANDOM % 10 + 1))
          done
