name: Test install
on:
  push:
    branches: [fix/ci-install-rapide]
    paths: [.github/workflows/test-install.yml]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          pip install requests playwright beautifulsoup4
          playwright install chromium
          sudo apt-get install -y --no-install-recommends poppler-utils
      - run: |
          python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(); pg = b.new_page(); pg.goto('https://example.com'); print(pg.title()); b.close()
          "
          pdftotext -v
